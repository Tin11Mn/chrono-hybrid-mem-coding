services:
  coding-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: "chrono-hybrid-mem-coding:${CODING_IMAGE_TAG:?Set CODING_IMAGE_TAG in .env.coding}"
    container_name: chrono-hybrid-mem-coding-api
    restart: unless-stopped
    env_file:
      - .env.coding
    environment:
      MEMORY_REQUIRE_MODEL: "true"
      MEMORY_DB_PATH: /data/chrono_hybrid_mem_coding.db
      MEMORY_STRUCTURED_QUERY_PLAN: "true"
      MEMORY_EVIDENCE_NEED_RETRIEVAL: "true"
      MEMORY_NEED_SELECT_BY_BM25: "true"
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - coding-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  coding-data:
    name: chrono_hybrid_mem_coding_data
